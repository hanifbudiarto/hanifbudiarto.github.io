<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vacation Is A Lie</title>
    <style>
        :root {
            --beach-sand: #f0e68c;
            --ocean-blue: #0077be;
            --stress-red: #ff3333;
            --office-gray: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #0077be 70%, #f0e68c 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* UI Overlay Pantai */
        .scenery {
            position: absolute;
            bottom: 10%;
            font-size: 5rem;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.2));
            z-index: 1;
        }

        /* Handphone UI */
        #phone {
            width: 320px;
            height: 600px;
            background: #1a1a1a;
            border: 10px solid #333;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        #phone-header {
            background: #000;
            color: white;
            padding: 15px 20px 5px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        #stats-bar {
            background: #222;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid var(--stress-red);
        }

        .stat-item {
            text-align: center;
            font-size: 0.7rem;
            color: #eee;
        }

        .stat-val {
            display: block;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Chat Area */
        #chat-area {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f5f5f5;
        }

        .bubble {
            max-width: 80%;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .boss-msg { background: #e1ffc7; align-self: flex-start; color: #333; border-left: 4px solid var(--stress-red); }
        .my-msg { background: #34b7f1; color: white; align-self: flex-end; }

        /* Actions */
        #action-panel {
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            display: none; /* Muncul saat ada pesan */
        }

        .btn-choice {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            border: 1px solid var(--office-gray);
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .btn-choice:hover { background: #eee; }

        /* Game Over */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        #blood-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, rgba(139, 0, 0, 0) 100%);
            z-index: 11;
            transition: 0.5s;
        }

        .stress-flicker {
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="scenery">🌴 🏖️ 🌊</div>
<div id="blood-overlay"></div>

<div id="phone">
    <div id="phone-header">
        <span>14:32</span>
        <span>📶 🔋 9%</span>
    </div>
    
    <div id="stats-bar">
        <div class="stat-item">SANITY<br><span id="sanity-val" class="stat-val">100</span></div>
        <div class="stat-item">REP<br><span id="rep-val" class="stat-val">50</span></div>
    </div>

    <div id="chat-area">
        <!-- Chat muncul di sini -->
    </div>

    <div id="action-panel">
        <div id="choices-container"></div>
    </div>
</div>

<div id="overlay">
    <h1 id="end-title">LIBURAN BERAKHIR</h1>
    <p id="end-desc"></p>
    <button onclick="location.reload()" style="padding: 10px 20px; background: #8b0000; color: white; border: none; cursor: pointer; margin-top: 20px;">ULANGI SIMULASI</button>
</div>

<script>
    let sanity = 100;
    let reputation = 50;
    let isWaiting = false;

    const chatArea = document.getElementById('chat-area');
    const actionPanel = document.getElementById('action-panel');
    const choicesContainer = document.getElementById('choices-container');
    const sanityVal = document.getElementById('sanity-val');
    const repVal = document.getElementById('rep-val');
    const bloodOverlay = document.getElementById('blood-overlay');

    const incomingMessages = [
        {
            sender: "Boss 👹",
            text: "Sori ganggu liburannya, tapi file revisi client 'Urgent_Final_v2' kok ga ada di folder ya?",
            choices: [
                { text: "Kirim sekarang (Sanity -15, Rep +10)", s: -15, r: 10, reply: "Siap pak, saya buka laptop bentar di pinggir kolam." },
                { text: "Bilang lagi di jalan (Sanity -5, Rep -10)", s: -5, r: -10, reply: "Maaf pak, saya lagi di tengah laut, sinyal susah." }
            ]
        },
        {
            sender: "Rekan Kantor 🐍",
            text: "Eh, denger-denger tim sebelah mau ambil project kita. Kamu bisa zoom 10 menit aja jelasin flow-nya?",
            choices: [
                { text: "Ikut Zoom (Sanity -20, Rep +15)", s: -20, r: 15, reply: "Oke, 10 menit aja ya (padahal 1 jam)." },
                { text: "Pura-pura mati (Sanity +10, Rep -15)", s: 10, r: -15, reply: "..." }
            ]
        },
        {
            sender: "Intern 👶",
            text: "Kak, cara login ke server gimana ya? Saya takut salah pencet terus kehapus semua.",
            choices: [
                { text: "Bantu pandu (Sanity -10, Rep +5)", s: -10, r: 5, reply: "Cek dokumen yang saya pin di Slack ya." },
                { text: "Abaikan (Sanity +5, Rep -5)", s: 5, r: -5, reply: "Bukan urusan saya sekarang." }
            ]
        }
    ];

    function addMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerHTML = `<strong>${sender}</strong><br>${text}`;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showChoices(choices) {
        isWaiting = true;
        choicesContainer.innerHTML = '';
        actionPanel.style.display = 'block';
        
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = c.text;
            btn.onclick = () => selectChoice(c);
            choicesContainer.appendChild(btn);
        });
    }

    function selectChoice(c) {
        actionPanel.style.display = 'none';
        addMessage("Me", c.reply, "my-msg");
        
        sanity += c.s;
        reputation += c.r;
        
        updateStats();
        isWaiting = false;
        
        if (sanity <= 0 || reputation <= 0 || reputation >= 100) {
            endGame();
        } else {
            setTimeout(nextEvent, 2000);
        }
    }

    function updateStats() {
        sanityVal.innerText = sanity;
        repVal.innerText = reputation;
        
        // Visual Stress
        const intensity = (100 - sanity) / 100;
        bloodOverlay.style.boxShadow = `inset 0 0 ${intensity * 150}px rgba(139, 0, 0, ${intensity})`;
        
        if (sanity < 30) {
            document.getElementById('phone').classList.add('stress-flicker');
        }
    }

    function nextEvent() {
        if (isWaiting) return;
        const msg = incomingMessages[Math.floor(Math.random() * incomingMessages.length)];
        addMessage(msg.sender, msg.text, "boss-msg");
        setTimeout(() => showChoices(msg.choices), 1000);
    }

    function endGame() {
        const overlay = document.getElementById('overlay');
        const desc = document.getElementById('end-desc');
        overlay.style.display = 'flex';
        
        if (sanity <= 0) {
            desc.innerText = "Anda mengalami mental breakdown di depan anak-istri. Anda mencoba memakan pasir karena mengira itu adalah dokumen Excel.";
        } else if (reputation <= 0) {
            desc.innerText = "Anda dipecat saat sedang berjemur. Bos mengirim kurir untuk mengambil laptop kantor dari tangan Anda secara paksa.";
        } else if (reputation >= 100) {
            desc.innerText = "Selamat! Anda menjadi karyawan terbaik. Anda tidak pernah liburan lagi seumur hidup karena kantor tidak bisa hidup tanpamu.";
        }
    }

    // Start game
    setTimeout(() => {
        addMessage("System", "Liburan dimulai. Matikan otak Anda...", "my-msg");
        setTimeout(nextEvent, 2000);
    }, 1000);
</script>

</body>
</html>
