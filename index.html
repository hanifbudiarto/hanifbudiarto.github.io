<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slavery Simulator 2026 - Global Edition</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #050505;
            --accent: #ff3e3e;
            --text-main: #e0e0e0;
            --vignette-strength: 40%;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            color: var(--text-main);
            transition: filter 0.5s ease;
        }

        /* Layar Identifikasi (Login) */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .input-box {
            background: transparent;
            border: 1px solid var(--accent);
            color: white;
            padding: 12px;
            font-family: 'Courier New';
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            width: 280px;
            letter-spacing: 2px;
        }

        .btn-start {
            background: var(--accent);
            color: black;
            border: none;
            padding: 12px 35px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .btn-start:hover { background: white; }

        /* Game UI */
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle, transparent var(--vignette-strength), black 150%);
            display: none;
        }

        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 0;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.7);
        }

        .score-board {
            position: absolute;
            top: 80px;
            left: 20px;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-left: 3px solid var(--accent);
            z-index: 20;
            min-width: 220px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        .leaderboard {
            margin-top: 15px;
            border-top: 1px solid #333;
            padding-top: 10px;
            font-size: 0.8rem;
            color: #aaa;
        }

        /* Targets & Bubbles */
        .doodle-target {
            position: absolute;
            width: 70px;
            height: 70px;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.05s;
        }

        .bubble {
            position: absolute;
            color: var(--accent);
            font-weight: bold;
            font-size: 13px;
            pointer-events: none;
            z-index: 100;
            text-shadow: 2px 2px #000;
            max-width: 220px;
            animation: slowFloat 3s ease-out forwards;
        }

        @keyframes slowFloat {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }

        /* Popups */
        .islamic-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            color: #1b5e20;
            padding: 30px;
            border-radius: 5px;
            border-top: 10px solid #4caf50;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            font-family: 'Georgia', serif;
            max-width: 400px;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            transition: background 0.3s;
        }

        .heavy-stress { animation: screenShake 0.1s infinite; }
        @keyframes screenShake {
            0% { transform: translate(2px, 1px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="margin-bottom: 30px;">IDENTIFIKASI ASET</h1>
        <input type="text" id="player-name" class="input-box" placeholder="MASUKKAN NAMA..." maxlength="12">
        <button class="btn-start" onclick="startGame()">Connect to Server</button>
        <p style="color: #444; font-size: 10px; margin-top: 20px;">Data Anda akan disinkronkan ke database global.</p>
    </div>

    <div id="overlay"></div>

    <div id="game-container">
        <div class="header">
            <h1 id="main-title">SLAVERY SIMULATOR</h1>
            <div id="asset-id" style="font-size: 10px; color: #555; letter-spacing: 2px;"></div>
        </div>

        <div class="score-board">
            Eksploitasi: <span id="score-val">0</span> Jam<br>
            <span id="insult-text" style="color: #666; font-size: 11px;">Status: Disposable Asset</span>
            
            <div class="leaderboard">
                <strong style="color: var(--accent)">MARTIR TERBAIK:</strong><br>
                <div id="global-rank-list">Memuat data...</div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG SUPABASE ---
        const SUPABASE_URL = 'https://ckzkqfajuhzytadsvolx.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNremtxZmFqdWh6eXRhZHN2b2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNTM0MjYsImV4cCI6MjA5MzYyOTQyNn0.FrwwcRHgxX-NbO3YvSs_7acVtlejKCNBvTFSQlilDJk';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-val');
        const insultDisplay = document.getElementById('insult-text');
        const overlay = document.getElementById('overlay');
        
        let score = 0;
        let playerName = "";
        let gameActive = false;
        let currentLevelThreshold = -1;

        // Audio Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, vol, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const statusLevels = [
            { threshold: 100, text: "Status: Unpaid Martyr", msg: "Hasbunallah wanikmal wakil. Cukup Allah bagi kita." },
            { threshold: 50, text: "Status: Corporate Hollow", msg: "Dunia ini sementara, akhirat selamanya." },
            { threshold: 25, text: "Status: Burnout Denier", msg: "Innallaha ma'ashobirin. Allah bersama orang sabar." },
            { threshold: 10, text: "Status: Cognitive Slave", msg: "Bismillah, niatkan lelahmu menjadi lillah." },
            { threshold: 0, text: "Status: Disposable Asset", msg: "Niatkan kerja untuk ibadah." }
        ];

        async function fetchLeaderboard() {
            const { data, error } = await supabase
                .from('leaderboard')
                .select('name, score')
                .order('score', { ascending: false })
                .limit(5);
            
            if (!error) {
                const listHtml = data.map((item, index) => 
                    `${index + 1}. ${item.name.toUpperCase()} (${item.score}h)`
                ).join('<br>');
                document.getElementById('global-rank-list').innerHTML = listHtml;
            }
        }

        async function syncData() {
            if (!playerName) return;
            await supabase
                .from('leaderboard')
                .upsert({ name: playerName, score: score }, { onConflict: 'name' });
            fetchLeaderboard();
        }

        function startGame() {
            const input = document.getElementById('player-name');
            playerName = input.value.trim() || "ANONYMOUS";
            document.getElementById('asset-id').innerText = `ASSET: ${playerName.toUpperCase()}`;
            document.getElementById('start-screen').style.display = 'none';
            container.style.display = 'block';
            gameActive = true;
            fetchLeaderboard();
            setInterval(createTask, 1400);
            setInterval(syncData, 10000); // Sync global tiap 10 detik
        }

        function showIslamicOasis(message) {
            gameActive = false;
            container.style.filter = "blur(15px)";
            const popup = document.createElement('div');
            popup.className = 'islamic-popup';
            popup.innerHTML = `
                <h3 style="margin-top:0; color:#2e7d32;">Jeda Sejenak</h3>
                <p>"${message}"</p>
                <button onclick="closeOasis(this)" style="background:#1b5e20; color:white; border:none; padding:10px 20px; cursor:pointer;">Aamiin</button>
            `;
            document.body.appendChild(popup);
            playSound(440, 'sine', 0.05, 1.5);
        }

        function closeOasis(btn) {
            container.style.filter = "none";
            btn.parentElement.remove();
            gameActive = true;
            syncData();
        }

        function updateStatus() {
            for (let i = 0; i < statusLevels.length; i++) {
                if (score >= statusLevels[i].threshold) {
                    if (currentLevelThreshold !== statusLevels[i].threshold) {
                        currentLevelThreshold = statusLevels[i].threshold;
                        showIslamicOasis(statusLevels[i].msg);
                    }
                    insultDisplay.innerText = statusLevels[i].text;
                    break;
                }
            }
        }

        function createTask() {
            if (!gameActive) return;
            const task = document.createElement('div');
            task.className = 'doodle-target';
            task.innerHTML = `<svg viewBox="0 0 100 100"><rect x="20" y="15" width="60" height="70" fill="#111" stroke="#333" stroke-width="2"/><line x1="35" y1="35" x2="65" y2="35" stroke="#ff3e3e" stroke-width="3"/></svg>`;
            
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 200) + 120;
            task.style.left = x + 'px'; task.style.top = y + 'px';

            task.onclick = function() {
                score++;
                scoreDisplay.innerText = score;
                playSound(200, 'square', 0.05, 0.1);
                updateStatus();
                
                overlay.style.backgroundColor = `rgba(255, 0, 0, ${Math.min(score/150, 0.6)})`;
                if (score % 50 === 0) {
                    container.classList.add('heavy-stress');
                    setTimeout(() => container.classList.remove('heavy-stress'), 2000);
                }
                this.remove();
            };
            container.appendChild(task);
            setTimeout(() => { if(task.parentNode) task.remove(); }, 2500);
        }
    </script>
</body>
</html>
