<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Slavery Simulator 2026</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent: #ff3e3e;
            --text-main: #e0e0e0;
            --vignette-strength: 40%;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            color: var(--text-main);
            transition: filter 0.5s ease;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle, transparent var(--vignette-strength), black 150%);
            transition: all 0.3s ease;
        }

        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 0;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.7);
        }

        .score-board {
            position: absolute;
            top: 80px;
            left: 20px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-left: 3px solid var(--accent);
            z-index: 20;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        .doodle-target {
            position: absolute;
            width: 70px;
            height: 70px;
            cursor: pointer;
            z-index: 5;
            filter: drop-shadow(0 0 5px rgba(255,62,62,0.2));
            transition: transform 0.05s;
        }

        .doodle-target:active { transform: scale(0.85); }

        .bubble {
            position: absolute;
            color: var(--accent);
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
            text-shadow: 2px 2px #000;
            max-width: 250px;
            line-height: 1.4;
            animation: slowFloat 4s ease-out forwards;
        }

        @keyframes slowFloat {
            0% { opacity: 0; transform: translateY(10px) skewX(10deg); }
            10% { opacity: 1; transform: translateY(0) skewX(0deg); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* Glitch Effect */
        .heavy-stress { animation: screenShake 0.15s infinite; }
        @keyframes screenShake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-2px, -1px); }
            50% { transform: translate(-1px, 2px); }
            75% { transform: translate(2px, 1px); }
            100% { transform: translate(0, 0); }
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            z-index: 100;
            transition: background 0.3s;
        }

        .islamic-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            color: #1b5e20;
            padding: 30px;
            border-radius: 5px;
            border-top: 10px solid #4caf50;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            font-family: 'Georgia', serif;
            max-width: 400px;
            animation: etherealIn 0.8s ease-out;
        }

        @keyframes etherealIn {
            from { opacity: 0; transform: translate(-50%, -45%) scale(0.9); filter: blur(10px); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }

        .oasis-btn {
            background: #1b5e20; color: white; border: none;
            padding: 12px 25px; margin-top: 20px;
            cursor: pointer; font-family: 'Courier New';
            text-transform: uppercase; letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="overlay"></div>

    <div class="header">
        <h1 id="main-title">SLAVERY SIMULATOR</h1>
        <div style="font-size: 10px; color: #444; letter-spacing: 2px;">EST. 2026 | HUMAN ASSET NO. 8402</div>
    </div>

    <div class="score-board">
        Eksploitasi: <span id="score-val">0</span> Jam<br>
        <span id="insult-text" style="color: #666; font-size: 11px; display: block; margin-top: 10px;">
            Status: Disposable Asset
        </span>
    </div>

    <div id="game-container"></div>

    <script>
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-val');
        const insultDisplay = document.getElementById('insult-text');
        const overlay = document.getElementById('overlay');
        
        let score = 0;
        let currentLevelThreshold = -1;

        // Sound Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, vol, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const darkQuotes = [
            "Gaji segini mau minta healing?", "Cicilanmu lebih setia daripada perusahaan.",
            "Inflasi 10%, gajimu 0%.", "Tabunganmu cukup untuk 3 jam.",
            "Bonus itu mitos, lembur itu pasti.", "Kamu tidak dibayar untuk punya perasaan.",
            "Cuti itu memindahkan meja kerja ke rumah.", "Mati di meja kerja adalah KPI tertinggi.",
            "Laptopmu adalah borgol modern.", "Tidur hanyalah kegagalan manajemen waktu.",
            "Kita kan keluarga (yang beracun).", "Passionmu adalah bahan bakar eksploitasi kami.",
            "Posisi kamu bisa diganti besok pagi.", "Kamu cuma angka di spreadsheet.",
            "Namamu lebih murah dari tinta printer.", "Burnout hanyalah istilah untuk yang lemah.",
            "Air mata tidak bisa di-convert jadi PDF.", "Dunia tetap berputar tanpa keberhasilanmu."
        ];

        const statusLevels = [
            { threshold: 100, text: "Status: Unpaid Martyr", msg: "Hasbunallah wanikmal wakil. Cukup Allah bagi kita, dan Dia sebaik-baik penolong." },
            { threshold: 50, text: "Status: Corporate Hollow", msg: "Dunia ini sementara, akhirat selamanya. Jangan biarkan duniamu mematikan hatimu." },
            { threshold: 25, text: "Status: Burnout Denier", msg: "Innallaha ma'ashobirin. Sesungguhnya Allah bersama orang-orang yang sabar." },
            { threshold: 10, text: "Status: Cognitive Slave", msg: "Jangan lupa bismillah sebelum kerja, agar lelahmu menjadi lillah." },
            { threshold: 0, text: "Status: Disposable Asset", msg: "Niatkan kerja untuk ibadah dan keluarga." }
        ];

        function showIslamicOasis(message) {
            container.style.filter = "blur(15px)";
            const popup = document.createElement('div');
            popup.className = 'islamic-popup';
            popup.innerHTML = `
                <h3 style="margin-top:0; color:#2e7d32; letter-spacing:1px;">Jeda Sejenak</h3>
                <p style="line-height:1.6;">"${message}"</p>
                <button class="oasis-btn" onclick="closeOasis(this)">Aamiin</button>
            `;
            document.body.appendChild(popup);
            playSound(440, 'sine', 0.05, 1.5);
        }

        function closeOasis(btn) {
            container.style.filter = "none";
            btn.parentElement.remove();
        }

        function updateStatus() {
            for (let i = 0; i < statusLevels.length; i++) {
                if (score >= statusLevels[i].threshold) {
                    if (currentLevelThreshold !== statusLevels[i].threshold) {
                        currentLevelThreshold = statusLevels[i].threshold;
                        showIslamicOasis(statusLevels[i].msg);
                    }
                    insultDisplay.innerText = statusLevels[i].text;
                    break;
                }
            }
        }

        function createTask() {
            const task = document.createElement('div');
            task.className = 'doodle-target';
            task.innerHTML = `
                <svg viewBox="0 0 100 100">
                    <rect x="20" y="15" width="60" height="70" fill="#111" stroke="#333" stroke-width="2"/>
                    <line x1="35" y1="35" x2="65" y2="35" stroke="#ff3e3e" stroke-width="3"/>
                    <line x1="35" y1="55" x2="55" y2="55" stroke="#333" stroke-width="2"/>
                </svg>`;

            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 150) + 100;

            task.style.left = x + 'px';
            task.style.top = y + 'px';

            task.onclick = function() {
                score++;
                scoreDisplay.innerText = score;
                playSound(200, 'square', 0.05, 0.1); // Click sound
                
                updateStatus();

                // Burnout Visuals
                overlay.style.backgroundColor = `rgba(255, 0, 0, ${Math.min(score/150, 0.6)})`;
                document.documentElement.style.setProperty('--vignette-strength', `${Math.max(10, 40 - score/5)}%`);

                // Heavy Stress Trigger
                if (score % 50 === 0) {
                    container.classList.add('heavy-stress');
                    playSound(60, 'sawtooth', 0.1, 1);
                    setTimeout(() => container.classList.remove('heavy-stress'), 2000);
                }

                showBubble(x, y);
                this.remove();
                
                if (Math.random() > 0.1) createTask();
                if (score > 30 && Math.random() > 0.4) createTask();
            };

            container.appendChild(task);
            setTimeout(() => { if(task.parentNode) task.remove(); }, 2500);
        }

        function showBubble(x, y) {
            const b = document.createElement('div');
            b.className = 'bubble';
            b.style.left = x + 'px';
            b.style.top = y + 'px';
            b.innerText = darkQuotes[Math.floor(Math.random() * darkQuotes.length)];
            container.appendChild(b);
            setTimeout(() => {
                b.style.transition = "opacity 1s, filter 1s";
                b.style.opacity = "0";
                b.style.filter = "blur(10px)";
                setTimeout(() => b.remove(), 1000);
            }, 3000);
        }

        setInterval(createTask, 1400);
    </script>
</body>
</html>
