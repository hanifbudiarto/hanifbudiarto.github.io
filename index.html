<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Slavery Simulator 2026</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent: #ff3e3e;
            --text-main: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            color: var(--text-main);
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0;
            color: var(--accent);
        }

        .score-board {
            position: absolute;
            top: 80px;
            left: 20px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-left: 3px solid var(--accent);
            z-index: 20;
        }

        .doodle-target {
            position: absolute;
            width: 70px;
            height: 70px;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.05s;
        }

        .bubble {
            position: absolute;
            color: var(--accent);
            font-weight: bold;
            font-size: 13px;
            pointer-events: none;
            animation: jitter 0.1s infinite;
            z-index: 30;
            text-shadow: 2px 2px #000;
        }
		
		@keyframes jitter {
			0% { transform: translate(0,0); }
			50% { transform: translate(1px, -1px); }
			100% { transform: translate(-1px, 1px); }
		}

        @keyframes glitchFloat {
            0% { opacity: 0; transform: translateY(0); }
            20% { opacity: 1; transform: translateY(-10px); }
            100% { opacity: 0; transform: translateY(-80px); }
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            z-index: 100;
            transition: background 0.5s;
        }
    </style>
</head>
<body>

    <div id="overlay"></div>

    <div class="header">
        <h1>SLAVERY SIMULATOR</h1>
        <div style="font-size: 10px; color: #555;">"Kerja, kerja, kerja, mati."</div>
    </div>

    <div class="score-board">
        Eksploitasi: <span id="score-val">0</span> Jam<br>
        <span id="insult-text" style="color: #888; font-size: 11px; display: block; margin-top: 10px;">
            Status: Masih bisa diperas.
        </span>
    </div>

    <div id="game-container"></div>

    <script>
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-val');
        const insultDisplay = document.getElementById('insult-text');
        const overlay = document.getElementById('overlay');
        
        let score = 0;

const darkQuotes = [
    // --- Golongan Gaji & Finansial ---
    "Gaji segini mau minta healing?", "Cicilanmu lebih setia daripada perusahaan ini.",
    "Inflasi naik 10%, gajimu naik 0%.", "Tabunganmu cukup untuk bertahan 3 jam.",
    "Bekerjalah sampai bosmu beli jet pribadi.", "Bonus itu mitos, lembur itu pasti.",
    "Self-reward pakai uang yang sebenarnya tidak ada.", "Kamu tidak dibayar untuk punya perasaan.",
    "Tanggal tua adalah identitasmu.", "Dompetmu lebih kosong dari janji manis HR.",

    // --- Golongan Eksploitasi & Lembur ---
    "Cuti itu sekadar memindahkan meja kerja ke rumah.", "Weekend hanyalah Senin yang menyamar.",
    "Pulang cepat adalah pengkhianatan.", "Keluargamu lupa cara mengeja namamu.",
    "Mati di meja kerja adalah KPI tertinggi.", "Laptopmu adalah borgol modern.",
    "Tidur hanyalah kegagalan manajemen waktu.", "Mata panda adalah lencana kehormatanmu.",
    "Istirahat? Nanti saja di alam kubur.", "Kamu tidak butuh vitamin, kamu butuh deadline baru.",

    // --- Golongan Toxic Positivity & Gaslighting ---
    "Kita kan sudah seperti keluarga (yang beracun).", "Coba lihat sisi positifnya (nggak ada).",
    "Kamu harus lebih 'agile' menderita.", "Tantangan ini akan mendewasakanmu (dan merusak mentalmu).",
    "Jangan kerja keras, kerja cerdas (padahal disuruh dua-duanya).", "Passionmu adalah bahan bakar eksploitasi kami.",
    "Dulu saya lebih parah dari kamu.", "Syukuri saja, di luar sana banyak yang pengangguran.",
    "Kamu kurang bersyukur, makanya cepat burnout.", "Mari kita 'align' ekspektasi penderitaan kita.",

    // --- Golongan Ketidaktergantian & Ketidakberartian ---
    "Posisi kamu bisa diganti besok pagi.", "Kamu cuma angka di spreadsheet yang bisa dihapus.",
    "Namamu di kartu nama lebih berharga dari nyawamu.", "Perusahaan tetap jalan kalau kamu mati hari ini.",
    "Kamu cuma aset yang terus menyusut.", "Jangan baper, ini cuma bisnis.",
    "Loyalitasmu tidak akan masuk dalam warisan.", "Siapa namamu tadi? Ah, sudahlah, kerjakan saja.",
    "Kamu bukan pahlawan, kamu cuma sekrup yang karatan.", "Ingat, kamu mudah dilupakan.",

    // --- Golongan Tekanan Stakeholder & Karir ---
    "Stakeholder tidak peduli kamu belum makan.", "Revisi ini demi masa depan (yang bukan milikmu).",
    "Urgent bagi mereka, lembur bagi kamu.", "Naik jabatan, naik pula dosis obat stresmu.",
    "Inovasi atau mati (tetap saja mati).", "Karier hanyalah labirin tanpa jalan keluar.",
    "Networking itu cuma ajang pamer penderitaan.", "Mimpi tinggi, skill medioker.",
    "Skill-mu sudah basi sejak dua jam yang lalu.", "Belajar terus sampai lupa cara hidup.",

    // --- Golongan Kesehatan Mental & Fisik ---
    "Mental health? Kerjakan dulu laporannya.", "Burnout hanyalah istilah untuk orang lemah.",
    "Asam lambungmu adalah bukti dedikasi.", "Rambut rontok demi target tercapai.",
    "Kopi adalah darahmu sekarang.", "Punggungmu sudah membentuk kursi kantor.",
    "Obat tidur adalah sahabat terbaikmu.", "Jantungmu berdetak mengikuti notifikasi Slack.",
    "Air mata tidak bisa di-convert jadi PDF.", "Panic attack? Selesaikan dulu meeting-nya.",

    // --- Golongan Realita Pahit ---
    "Senin adalah monster yang nyata.", "Meeting ini sebenarnya bisa lewat email.",
    "Email ini sebenarnya tidak perlu dibaca.", "Dokumentasi ini tidak akan pernah dibaca.",
    "Requirement berubah saat kamu hampir selesai.", "Bug ini adalah fitur baru (katanya).",
    "Technical debt-mu sudah setinggi gedung ini.", "Dunia tetap berputar tanpa keberhasilanmu.",
    "Bahagia itu rencana tahun depan.", "Harapan adalah kesalahan terbesar di kantor ini.",

    // --- Golongan Sinis & Menyakitkan ---
    "Kamu itu investasi bodong.", "Otakmu butuh upgrade, tapi budget-nya nggak ada.",
    "Terima kasih atas kerja kerasmu (tidak tulus).", "Jangan terlalu percaya diri, kamu cuma beruntung.",
    "Ide kamu bagus, tapi kita pakai ide bos saja.", "Feedback: Kamu mengecewakan.",
    "Sudah berapa banyak umur yang kamu jual hari ini?", "Suaramu tidak terdengar di ruang rapat.",
    "Kamu terlalu mahal untuk hasil seminim ini.", "Jangan tanya 'kenapa', tanya 'kapan selesai'.",

    // --- Golongan Akhir Zaman Korporat ---
    "Selamat datang di neraka ber-AC.", "Borgolmu tidak terlihat, tapi terasa berat.",
    "Kebebasan hanyalah ilusi saat jam makan siang.", "Masa depanmu sudah di-outsourcing.",
    "Kamu adalah robot yang gagal diprogram.", "Kubikelmu adalah peti matimu.",
    "Selamat menikmati sisa hidup yang tidak seberapa.", "Satu klik lagi menuju kehancuran.",
    "Jangan berhenti, kemiskinan mengintaimu.", "Hidupmu adalah draf yang ditolak Tuhan."
];

        const statusLevels = [
            { threshold: 100, text: "Status: LIMBAH INDUSTRI." },
            { threshold: 50, text: "Status: Zombie Korporat." },
            { threshold: 25, text: "Status: Robot Excel." },
            { threshold: 10, text: "Status: Budak Magang Naif." },
            { threshold: 0, text: "Status: Masih bisa diperas." }
        ];

        function updateStatus() {
            // Logika pencarian status yang pasti jalan
            for (let i = 0; i < statusLevels.length; i++) {
                if (score >= statusLevels[i].threshold) {
                    insultDisplay.innerText = statusLevels[i].text;
                    break;
                }
            }
        }

        function createTask() {
            const task = document.createElement('div');
            task.className = 'doodle-target';
            task.innerHTML = `
                <svg viewBox="0 0 100 100">
                    <rect x="20" y="15" width="60" height="70" fill="#222" stroke="#444" stroke-width="2"/>
                    <line x1="35" y1="35" x2="65" y2="35" stroke="#ff3e3e" stroke-width="3"/>
                </svg>`;

            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 150) + 100;

            task.style.left = x + 'px';
            task.style.top = y + 'px';

            task.onclick = function() {
                score++;
                scoreDisplay.innerText = score; // Update angka skor
                
                updateStatus(); // Update teks status

                // Efek visual burnout (layar memerah)
                overlay.style.backgroundColor = `rgba(255, 0, 0, ${Math.min(score/100, 0.5)})`;

                showBubble(x, y);
                this.remove();
                
                // Spawn tugas baru secara agresif
                if (Math.random() > 0.2) createTask();
                if (score > 20 && Math.random() > 0.5) createTask();
            };

            container.appendChild(task);

            // Tugas hilang otomatis (deadline)
            setTimeout(() => { if(task.parentNode) task.remove(); }, 3000);
        }

        function showBubble(x, y) {
            const b = document.createElement('div');
            b.className = 'bubble';
            b.style.left = x + 'px';
            b.style.top = y + 'px';
            b.innerText = darkQuotes[Math.floor(Math.random() * darkQuotes.length)];
            container.appendChild(b);
            setTimeout(() => {
		        b.style.transition = "opacity 1s";
		        b.style.opacity = "0";
		        setTimeout(() => b.remove(), 1000);
		    }, 4000);
        }

        // Mulai permainan
        setInterval(createTask, 1200);
    </script>
</body>
</html>
